<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 630" role="img" aria-label="Illustration of a robot arm working with scientific laboratory instruments">
 <defs>
  <linearGradient id="base" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B385A"/><stop offset="1" stop-color="#071A35"/></linearGradient>
  <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D7EEFC"/><stop offset=".45" stop-color="#78B7D9"/><stop offset="1" stop-color="#34749E"/></linearGradient>
  <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ACD8F2"/><stop offset="1" stop-color="#30688F"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#3FE1E9"/><stop offset="1" stop-color="#6BB8FF"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#2FC4EB" stop-opacity=".19"/><stop offset="1" stop-color="#2FC4EB" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#6CC6F4" stroke-opacity=".12" fill="none"/></pattern>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000B20" flood-opacity=".55"/></filter>
 </defs>
